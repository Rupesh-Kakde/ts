<div style="width: 360px; max-width: 90%; margin: 60px auto; padding: 25px; border: 2px solid #1976d2; border-radius: 12px; background: #f5f9ff; text-align: center; box-shadow: 0 0 10px #aaa; font-family: Arial, sans-serif;">
  <h2 style="color: #0d47a1;">Login Form</h2>
  <input
    type="text"
    [(ngModel)]="username"
    placeholder="Enter Username"
    style="width: 90%; padding: 10px; margin-bottom: 15px; box-sizing: border-box;">
  <input
    type="password"
    [(ngModel)]="password"
    placeholder="Enter Password"
    style="width: 90%; padding: 10px; margin-bottom: 20px; box-sizing: border-box;">
  <button
    (click)="login()"
    style="padding: 10px 30px; background: #1976d2; color: white; border: none; border-radius: 5px; cursor: pointer;">
    Login
  </button>
  <h3
    *ngIf="message !== ''"
    [style.color]="success ? 'green' : 'red'"
    style="margin-top: 20px;">
    {{ message }}
  </h3>
</div>
