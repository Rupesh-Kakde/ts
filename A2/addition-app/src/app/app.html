<div style="width: 350px; max-width: 90%; margin: 60px auto; padding: 25px; border: 2px solid #4caf50; border-radius: 12px; text-align: center; background: #f4f8ff; box-shadow: 0 0 10px #aaa; font-family: Arial, sans-serif;">
  <h2 style="color: #0d47a1;">Addition of Two Numbers</h2>
  <input
    type="number"
    [(ngModel)]="num1"
    placeholder="Enter First Number"
    style="width: 90%; padding: 10px; margin-bottom: 15px; box-sizing: border-box;">
  <input
    type="number"
    [(ngModel)]="num2"
    placeholder="Enter Second Number"
    style="width: 90%; padding: 10px; margin-bottom: 20px; box-sizing: border-box;">
  <button
    (click)="add()"
    [disabled]="num1 === null || num2 === null"
    style="padding: 10px 30px; background: #1976d2; color: white; border: none; border-radius: 5px; cursor: pointer;">
    Add
  </button>
  <h3 *ngIf="show" style="color: green; margin-top: 20px;">Result = {{ result }}</h3>
</div>
