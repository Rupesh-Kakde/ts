<div style="max-width: 900px; margin: 40px auto; padding: 20px; font-family: Arial, sans-serif;">
  <h2 style="text-align: center; color: #0d47a1;">Student Details</h2>
  <table style="width: 100%; border-collapse: collapse; text-align: left;">
    <thead>
      <tr style="background: #1976d2; color: white;">
        <th style="padding: 12px; border: 1px solid #ddd;">Roll No.</th>
        <th style="padding: 12px; border: 1px solid #ddd;">Name</th>
        <th style="padding: 12px; border: 1px solid #ddd;">Course</th>
        <th style="padding: 12px; border: 1px solid #ddd;">City</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let student of students">
        <td style="padding: 10px; border: 1px solid #ddd;">{{ student.rollNo }}</td>
        <td style="padding: 10px; border: 1px solid #ddd;">{{ student.name }}</td>
        <td style="padding: 10px; border: 1px solid #ddd;">{{ student.course }}</td>
        <td style="padding: 10px; border: 1px solid #ddd;">{{ student.city }}</td>
      </tr>
    </tbody>
  </table>
</div>
