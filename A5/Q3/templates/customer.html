<!DOCTYPE html>
<html>
<head>
    <title>Customer Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <div class="result-box">

        <h1>Customer Details</h1>
        <p class="subtitle">Submitted customer information</p>

        <table>

            <tr>
                <th>Customer Name</th>
                <td>{{ custname }}</td>
            </tr>

            <tr>
                <th>Email</th>
                <td>{{ email }}</td>
            </tr>

            <tr>
                <th>Mobile Number</th>
                <td>{{ mobno }}</td>
            </tr>

            <tr>
                <th>Address</th>
                <td>{{ address }}</td>
            </tr>

            <tr>
                <th>Pincode</th>
                <td>{{ pincode }}</td>
            </tr>

        </table>

        <a href="/" class="back-button">Enter Another Customer</a>

    </div>

</div>

</body>
</html>
