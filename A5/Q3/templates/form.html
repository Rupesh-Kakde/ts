<!DOCTYPE html>
<html>
<head>
    <title>Customer Registration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <div class="form-box">

        <h1>Customer Registration</h1>
        <p class="subtitle">Please enter your details below</p>

        <form action="/submit" method="POST">

            <div class="form-group">
                <label>Customer Name</label>
                <input type="text" name="CustName" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" name="MobNo" placeholder="Enter your mobile number" required>
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea name="address" placeholder="Enter your complete address" required></textarea>
            </div>

            <div class="form-group">
                <label>Pincode</label>
                <input type="text" name="pincode" placeholder="Enter your pincode" required>
            </div>

            <button type="submit">Submit Details</button>

        </form>

    </div>

</div>

</body>
</html>
